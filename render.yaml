# Blueprint Render : crée l'API depuis ce dépôt (branche main).
# Le site Next.js est hébergé sur Vercel (sa compilation dépasse les 512 Mo de l'offre gratuite de Render).
# Région Ohio : la même zone que la base Neon (aws us-east-2), pour des requêtes quasi instantanées.

services:
  # API Express + Prisma
  - type: web
    name: fragrance-lab-api
    runtime: node
    region: ohio
    plan: free
    rootDir: backend
    branch: main
    buildCommand: npm ci && npm run build
    # Applique les migrations en attente avant chaque démarrage
    startCommand: npm run migrate:deploy && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Chaîne de connexion Neon, à saisir dans le tableau de bord Render (jamais dans le dépôt)
      - key: DATABASE_URL
        sync: false
